name: App CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - app/v[0-9]+\.[0-9]+\.[0-9]+
      - app/v[0-9]+\.[0-9]+\.[0-9]+-staging
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    uses: "./.github/workflows/build.yml"

  lint:
    name: Lint
    uses: "./.github/workflows/lint.yml"

  test:
    name: Test
    uses: ./.github/workflows/test.yml
